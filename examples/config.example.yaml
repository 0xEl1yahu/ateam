# config.yaml in the target's private intent repo ($(ateam intent path)/config.yaml). Every key is optional; these are the defaults plus examples.
target_branch: main             # approval commits land here; workers' worktrees branch from it
setup:                          # run once per new worktree, before any worker
  - "python -m venv .venv && .venv/bin/pip install -e '.[dev]'"
env:                            # exported to workers and checks
  PYTHONDONTWRITEBYTECODE: "1"
checks:                         # deterministic checks available to contracts
  - {name: unit, cmd: ".venv/bin/pytest -q"}
  - {name: types, cmd: ".venv/bin/mypy src"}
serialize_checks: false         # true when checks share a resource such as one database
protected_paths: [".ateam/**", ".claude/**"]
max_workers: 2
global_record_cap: 5
tiers: {}                       # overrides, e.g. {standard: {build: {model: opus}}}
